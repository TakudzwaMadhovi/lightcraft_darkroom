# Builds the Intel-only (x86_64) LightCraft.app + .dmg for the 2020 MacBook Air.
# Runs on every push to main or air-edition, or from Actions -> "Air DMG" -> Run workflow (that
# button appears once this file is on the default branch). Download the artifact from the run.
# Ad-hoc signed: on first launch right-click the app -> Open (see docs/air/README.md).
name: Air DMG

on:
  push:
    branches: [main, air-edition]
  workflow_dispatch:

concurrency:
  group: air-dmg-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  dmg:
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          key: air-x86_64
      - name: Build and package (x86_64 only)
        run: packaging/macos/package.sh --arch x86_64
      - name: Verify architecture
        run: |
          lipo -info target/macos-package/LightCraft.app/Contents/MacOS/LightCraft
          lipo -info target/macos-package/LightCraft.app/Contents/MacOS/LightCraft | grep -q "x86_64"
      - uses: actions/upload-artifact@v4
        with:
          name: lightcraft-air-x86_64-dmg
          path: dist/release/*.dmg
          if-no-files-found: error
